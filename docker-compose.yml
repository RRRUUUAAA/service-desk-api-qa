name: service-desk-api-qa

services:
  db:
    image: postgres:16-alpine@sha256:f2f98726820d0342055351c6e9d36e705f5bfffb3dd53ff556325114b08afb6d
    environment:
      POSTGRES_DB: service_desk
      POSTGRES_USER: service_desk
      POSTGRES_PASSWORD: service_desk
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U service_desk -d service_desk"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: .
      network: ${BUILD_NETWORK:-host}
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple}
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: postgresql+psycopg://service_desk:service_desk@db:5432/service_desk
      JWT_SECRET: local-dev-secret-change-me-32-bytes-minimum
      ACCESS_TOKEN_EXPIRE_MINUTES: "30"
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: Admin123!
      ADMIN_EMAIL: admin@example.com
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)",
        ]
      interval: 3s
      timeout: 3s
      retries: 20

  tests:
    profiles: ["test"]
    build:
      context: .
      network: ${BUILD_NETWORK:-host}
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple}
    command: pytest
    environment:
      API_BASE_URL: http://api:8000
      DATABASE_URL: postgresql+psycopg://service_desk:service_desk@db:5432/service_desk
      JWT_SECRET: local-dev-secret-change-me-32-bytes-minimum
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: Admin123!
      ADMIN_EMAIL: admin@example.com
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./reports:/app/reports

volumes:
  postgres_data:
