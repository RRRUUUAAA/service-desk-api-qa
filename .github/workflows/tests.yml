name: API test suite

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

env:
  PIP_INDEX_URL: https://pypi.org/simple
  BUILD_NETWORK: default
  COMPOSE_PROGRESS: plain

jobs:
  api-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: docker compose config

      - name: Remove stale reports
        run: |
          mkdir -p reports
          find reports -mindepth 1 -maxdepth 1 -type f -delete

      - name: Start API and PostgreSQL
        run: docker compose up -d --build --wait --wait-timeout 180 db api

      - name: Run pytest
        run: docker compose --profile test run --rm tests

      - name: Upload JUnit report
        if: always() && hashFiles('reports/junit.xml') != ''
        uses: actions/upload-artifact@v4
        with:
          name: junit-report
          path: reports/junit.xml
          if-no-files-found: error

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop containers
        if: always()
        run: docker compose down -v
